name: Deploy VigIA Demo → GitHub Pages

on:
  push:
    branches: [preprod, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build demo site
        run: |
          mkdir -p _site/prototype
          mkdir -p _site/prototype/icons

          # Copier support.js (dc-runtime)
          cp prototype/support.js _site/prototype/support.js

          # Copier et renommer le prototype → index.html
          cp "prototype/VigIA - Prototype extension.dc.html" _site/prototype/index.html

          # Copier aussi le prototype embarquable référencé par l'iframe de landing.html
          cp "prototype/VigIA - Prototype extension.dc.html" _site/prototype/prototype-embed.html

          # Copier les icônes SVG pour le prototype (les PNG ne sont pas nécessaires côté web)
          cp extension/icons/vigia.svg _site/prototype/icons/vigia.svg

          # Page d'accueil principale
          cp prototype/landing.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
