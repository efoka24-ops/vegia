<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>VigIA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: 'Libre Franklin', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #11201A;
      font-size: 13px;
      overflow: hidden;
    }

    /* ── HEADER ── */
    .hdr {
      background: #0A5C42;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .hdr-left { display: flex; align-items: center; gap: 10px; }
    .hdr-title { color: #fff; font-weight: 800; font-size: 17px; }
    .hdr-title .ia { color: #F2B705; }

    /* Toggle switch */
    .sw { position: relative; width: 40px; height: 22px; display: inline-block; }
    .sw input { opacity: 0; width: 0; height: 0; }
    .sw-track {
      position: absolute; inset: 0;
      background: rgba(255,255,255,.28);
      border-radius: 22px; cursor: pointer;
      transition: background .2s;
    }
    .sw-track::before {
      content: '';
      position: absolute; left: 3px; top: 3px;
      width: 16px; height: 16px;
      background: #fff; border-radius: 50%;
      transition: transform .22s cubic-bezier(.34,1.56,.64,1);
      box-shadow: 0 1px 4px rgba(0,0,0,.22);
    }
    .sw input:checked + .sw-track { background: rgba(255,255,255,.52); }
    .sw input:checked + .sw-track::before { transform: translateX(18px); }

    /* ── BODY ── */
    .body { padding: 16px 18px; }

    .section-lbl {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #83837b;
      font-weight: 700;
      margin-bottom: 8px;
    }

    /* ── ÉTAT HEADER ── */
    .state-idle {
      font-size: 16px;
      font-weight: 700;
      color: #11201A;
      margin-top: 6px;
      margin-bottom: 14px;
    }
    .state-scanning {
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      margin-bottom: 14px;
      font-size: 15px;
      font-weight: 700;
      color: #0A5C42;
    }
    .state-done {
      display: none;
      align-items: baseline;
      gap: 8px;
      margin-top: 6px;
      margin-bottom: 14px;
    }
    .alert-num {
      font-family: 'Bricolage Grotesque', Georgia, sans-serif;
      font-size: 36px;
      font-weight: 800;
      color: #C8102E;
      line-height: 1;
    }
    .alert-word {
      font-size: 15px;
      font-weight: 700;
      color: #C8102E;
    }

    /* ── SPINNER ── */
    @keyframes vigSpin { to { transform: rotate(360deg); } }
    .spin {
      width: 14px; height: 14px;
      border: 2px solid #cfe0d8;
      border-top-color: #0A5C42;
      border-radius: 50%;
      display: inline-block;
      animation: vigSpin .7s linear infinite;
      flex-shrink: 0;
    }
    .spin-sm {
      width: 13px; height: 13px;
      border: 2px solid #cfe0d8;
      border-top-color: #0A5C42;
      border-radius: 50%;
      display: inline-block;
      animation: vigSpin .7s linear infinite;
      flex-shrink: 0;
    }

    /* ── MODULE ROWS ── */
    .modules { display: flex; flex-direction: column; gap: 6px; }
    .mod-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: #F7F6F2;
      border-radius: 10px;
    }
    .mod-name {
      font-size: 13px;
      font-weight: 800;
      color: #0A5C42;
      width: 108px;
      flex-shrink: 0;
    }
    .mod-desc {
      font-size: 12px;
      color: #65676B;
      flex: 1;
      min-width: 0;
    }
    .mod-act { flex-shrink: 0; }

    .btn-verify {
      background: #0A5C42;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Libre Franklin', sans-serif;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity .14s;
    }
    .btn-verify:hover { opacity: .84; }

    .badge-red   { font-size: 12px; font-weight: 800; color: #C8102E; white-space: nowrap; }
    .badge-green { font-size: 12px; font-weight: 800; color: #0A5C42;  white-space: nowrap; }

    /* ── ACTIONS ── */
    .btn-scan-all {
      display: block;
      width: 100%;
      margin-top: 14px;
      background: #0A5C42;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      font-weight: 800;
      font-family: 'Libre Franklin', sans-serif;
      cursor: pointer;
      transition: opacity .14s;
    }
    .btn-scan-all:hover { opacity: .88; }

    /* ── DISABLED BANNER ── */
    .disabled-banner {
      display: none;
      padding: 10px 18px;
      background: rgba(200,16,46,.07);
      border-bottom: 1px solid rgba(200,16,46,.18);
      font-size: 11px;
      font-weight: 600;
      color: #C8102E;
    }
    .disabled-banner.show { display: block; }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-left">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M12 2L21 6V12C21 17 17 21 12 22C7 21 3 17 3 12V6Z" fill="#fff"/>
      <path d="M8 12l3 3 5-6" stroke="#0A5C42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="hdr-title">Vig<span class="ia">IA</span></span>
  </div>
  <label class="sw" title="Activer / désactiver VigIA">
    <input type="checkbox" id="toggleEnabled" checked>
    <span class="sw-track"></span>
  </label>
</div>

<!-- BANNIÈRE DÉSACTIVÉ -->
<div class="disabled-banner" id="disabledBanner">⚠ VigIA est désactivé sur cette page.</div>

<!-- BODY -->
<div class="body">
  <div class="section-lbl">Protection active sur cette page</div>

  <!-- ÉTAT : idle -->
  <div class="state-idle" id="stateIdle">Prêt à analyser cette page.</div>

  <!-- ÉTAT : scanning -->
  <div class="state-scanning" id="stateScanning">
    <span class="spin"></span>Analyse en cours…
  </div>

  <!-- ÉTAT : done -->
  <div class="state-done" id="stateDone">
    <span class="alert-num" id="alertCount">0</span>
    <span class="alert-word" id="alertWord">alertes détectées</span>
  </div>

  <!-- MODULES -->
  <div class="modules">
    <div class="mod-row">
      <span class="mod-name">Vérif-Média</span>
      <span class="mod-desc">Manipulation IA</span>
      <span class="mod-act" id="act-media"></span>
    </div>
    <div class="mod-row">
      <span class="mod-name">Vérif-Info</span>
      <span class="mod-desc">Fact-checking</span>
      <span class="mod-act" id="act-info"></span>
    </div>
    <div class="mod-row">
      <span class="mod-name">Vérif-Lien</span>
      <span class="mod-desc">Phishing / arnaque</span>
      <span class="mod-act" id="act-link"></span>
    </div>
    <div class="mod-row">
      <span class="mod-name">Vérif-Compte</span>
      <span class="mod-desc">Compte officiel</span>
      <span class="mod-act" id="act-account"></span>
    </div>
  </div>

  <!-- ACTIONS -->
  <button class="btn-scan-all" id="btnScanAll">Tout vérifier sur cette page</button>
</div>

<script src="popup.js"></script>
</body>
</html>
