<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VigIA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:  #16a34a;
      --orange: #d97706;
      --red:    #dc2626;
      --dark:   #0f172a;
      --card:   #1e293b;
      --border: #334155;
      --muted:  #64748b;
      --text:   #f1f5f9;
      --sub:    #94a3b8;
      --font:   -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    body {
      width: 320px;
      background: var(--dark);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.4;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: linear-gradient(135deg, #0f3d28 0%, #0f172a 100%);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: relative;
      overflow: hidden;
    }

    .header::after {
      content: '';
      position: absolute;
      top: -20px; right: -20px;
      width: 80px; height: 80px;
      background: radial-gradient(circle, rgba(59,130,246,0.18), transparent 70%);
      pointer-events: none;
    }

    .header-logo {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      background-image: url("icons/vigia.svg");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      filter: drop-shadow(0 0 8px rgba(10,92,66,0.6));
    }

    .header-text h1 {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #fff;
    }

    .header-text p {
      font-size: 10px;
      color: var(--sub);
      margin-top: 1px;
      letter-spacing: 0.3px;
    }

    .header-toggle {
      margin-left: auto;
      flex-shrink: 0;
    }

    /* Toggle switch */
    .switch { position: relative; width: 38px; height: 21px; display: inline-block; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #334155;
      border-radius: 21px;
      cursor: pointer;
      transition: background 0.22s;
    }
    .slider::before {
      content: '';
      position: absolute;
      left: 3px; top: 3px;
      width: 15px; height: 15px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    input:checked + .slider { background: #16a34a; }
    input:checked + .slider::before { transform: translateX(17px); }

    /* ── Status bar ──────────────────────────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      color: var(--sub);
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot--on  { background: #22c55e; box-shadow: 0 0 5px #22c55e; }
    .status-dot--off { background: var(--muted); }

    .status-platform {
      margin-left: auto;
      padding: 2px 7px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      font-size: 10px;
      color: var(--sub);
    }

    /* ── Stats grid ──────────────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 8px;
      background: var(--dark);
      gap: 3px;
    }

    .stat__value {
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.5px;
    }
    .stat__label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat__bar {
      width: 24px; height: 2px;
      border-radius: 2px;
      margin-top: 3px;
      opacity: 0.6;
    }

    .stat--green  .stat__value { color: #4ade80; }
    .stat--orange .stat__value { color: #fbbf24; }
    .stat--red    .stat__value { color: #f87171; }
    .stat--green  .stat__bar  { background: #16a34a; }
    .stat--orange .stat__bar  { background: #d97706; }
    .stat--red    .stat__bar  { background: #dc2626; }

    /* ── Dernières vérifications ─────────────────────────── */
    .section-title {
      padding: 10px 16px 6px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--muted);
      font-weight: 600;
    }

    .history {
      padding: 0 10px 6px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      border-radius: 7px;
      cursor: default;
      transition: background 0.12s;
    }
    .history-item:hover { background: rgba(255,255,255,0.03); }

    .history-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .history-dot--green  { background: #16a34a; }
    .history-dot--orange { background: #d97706; }
    .history-dot--red    { background: #dc2626; }

    .history-info { flex: 1; min-width: 0; }

    .history-type {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .history-label {
      font-size: 11px;
      color: var(--sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-time {
      font-size: 10px;
      color: var(--border);
      flex-shrink: 0;
    }

    .history-empty {
      padding: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    /* ── Actions ─────────────────────────────────────────── */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 6px 10px 10px;
      border-top: 1px solid var(--border);
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--sub);
      font: 600 11px var(--font);
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
    }
    .action-btn:hover {
      background: rgba(255,255,255,0.08);
      border-color: #475569;
      color: var(--text);
    }
    .action-btn .icon { font-size: 13px; }

    /* ── Footer ──────────────────────────────────────────── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 14px;
      border-top: 1px solid rgba(255,255,255,0.04);
      font-size: 10px;
      color: #334155;
    }

    .footer a {
      color: #475569;
      text-decoration: none;
    }
    .footer a:hover { color: var(--sub); }

    /* ── Bannière "désactivé" ────────────────────────────── */
    .disabled-banner {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(220,38,38,0.08);
      border-bottom: 1px solid rgba(220,38,38,0.2);
      font-size: 11px;
      color: #fca5a5;
    }
    .disabled-banner.visible { display: flex; }

    /* ── Toast ───────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 10px; left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 11px;
      color: var(--sub);
      opacity: 0;
      transition: all 0.22s;
      white-space: nowrap;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-logo"></div>
    <div class="header-text">
      <h1>VigIA</h1>
      <p>Protection contre la désinformation</p>
    </div>
    <div class="header-toggle">
      <label class="switch" title="Activer / désactiver VigIA">
        <input type="checkbox" id="toggleEnabled" checked />
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <!-- Bannière désactivé -->
  <div class="disabled-banner" id="disabledBanner">
    <span>⚠</span>
    VigIA est désactivé sur cette page.
  </div>

  <!-- Status -->
  <div class="status-bar">
    <span class="status-dot status-dot--on" id="statusDot"></span>
    <span id="statusText">Actif</span>
    <span class="status-platform" id="platformLabel">—</span>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat stat--green">
      <div class="stat__value" id="countGreen">0</div>
      <div class="stat__label">Fiables</div>
      <div class="stat__bar"></div>
    </div>
    <div class="stat stat--orange">
      <div class="stat__value" id="countOrange">0</div>
      <div class="stat__label">Douteux</div>
      <div class="stat__bar"></div>
    </div>
    <div class="stat stat--red">
      <div class="stat__value" id="countRed">0</div>
      <div class="stat__label">Suspects</div>
      <div class="stat__bar"></div>
    </div>
  </div>

  <!-- Historique -->
  <div class="section-title">Dernières vérifications</div>
  <div class="history" id="history">
    <div class="history-empty" id="historyEmpty">
      Survolez une image, un texte ou un lien<br>et cliquez "Vérifier"
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="action-btn" id="btnReport">
      <span class="icon">🚩</span> Signaler
    </button>
    <button class="action-btn" id="btnClear">
      <span class="icon">🗑</span> Effacer stats
    </button>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <span>VigIA v0.1.0</span>
    <span>Données locales uniquement</span>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
