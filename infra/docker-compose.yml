version: '3.9'

# Dev local. En production, Railway fournit PostgreSQL et build le Dockerfile.
# La stratégie « APIs tierces » a supprimé le besoin de Redis et Qdrant.

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: vigia
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: vigia
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
